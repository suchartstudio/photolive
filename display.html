<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Screen - Live Event</title>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* Animation พื้นหลังไล่สีแบบเคลื่อนไหวช่วยเพิ่มมิติให้จอ LED */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body { 
            background: linear-gradient(-45deg, #0a0a0a, #1a1a2e, #16213e, #0f3460);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden; 
            margin: 0; 
            display: flex;
            font-family: 'Itim', cursive;
        }
    </style>
</head>
<body class="w-screen h-screen relative text-white select-none">

    <div class="w-full h-full flex items-center justify-center p-4">
        <img id="mainDisplayImage" class="w-full h-full object-contain drop-shadow-[0_10px_20px_rgba(0,0,0,0.7)] transition-all duration-700 ease-in-out opacity-0" src="" alt="Event Broadcast">
        
        <div id="noImageTxt" class="absolute text-3xl font-bold text-gray-400 animate-pulse text-center">
            🚀 กำลังรอรูปภาพจากผู้ร่วมสนุก...
        </div>
    </div>

    <div class="absolute bottom-6 right-6 flex items-center gap-6 bg-black/60 backdrop-blur-md p-4 rounded-2xl border border-white/10 shadow-2xl z-10">
        <div class="text-right">
            <div id="clockTime" class="text-3xl font-bold text-yellow-400 tracking-wider">00:00:00</div>
            <div id="eventTitle" class="text-sm text-gray-300 font-medium">สแกนเพื่อส่งรูปขึ้นจอ</div>
        </div>
        <div class="bg-white p-2 rounded-xl shadow-lg flex items-center justify-center">
            <div id="qrcode"></div>
        </div>
    </div>

    <div id="blackoutOverlay" class="fixed inset-0 bg-black z-50 flex items-center justify-center hidden">
        <h1 class="text-4xl font-bold text-gray-600 animate-pulse">พักหน้าจอระบบสักครู่...</h1>
    </div>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { collection, query, orderBy, onSnapshot, limit, doc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const mainDisplayImage = document.getElementById('mainDisplayImage');
        const noImageTxt = document.getElementById('noImageTxt');
        const blackoutOverlay = document.getElementById('blackoutOverlay');

        let currentPhotos = [];
        let currentMode = 'all'; // 'all', 'latest', 'blackout'
        let slideInterval = null;
        let currentIdx = 0;
        let manualOverride = false;
        window.manualTimer = null;

        // --- 1. ระบบนาฬิกาหน้างาน ---
        function updateClock() {
            const now = new Date();
            document.getElementById('clockTime').innerText = now.toLocaleTimeString('th-TH', { hour12: false });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 2. ระบบ QR Code สแกนร่วมสนุก ---
        // *** คุณสามารถเปลี่ยน URL ตรงนี้ให้ลิงก์ไปยังหน้าอัปโหลดรูปภาพของคุณได้เลย ***
        new QRCode(document.getElementById("qrcode"), {
            text: "https://suchartstudio.github.io/photolive/", 
            width: 360,
            height: 360,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.M
        });

        // --- 3. ฟังก์ชันควบคุมการเล่นสไลด์โชว์รูปภาพ ---
        function startSlideshow() {
            if (slideInterval) clearInterval(slideInterval);
            
            // เล่นรูปภาพแรกทันทีเมื่อระบบพร้อม
            playNextSlide(); 
            
            // สลับรูปภาพอัตโนมัติทุกๆ 5 วินาที
            slideInterval = setInterval(() => {
                if (!manualOverride) {
                    playNextSlide();
                }
            }, 5000);
        }

        function playNextSlide() {
            if (currentPhotos.length === 0) return;
            if (currentIdx >= currentPhotos.length) currentIdx = 0;
            
            showImage(currentPhotos[currentIdx].url);
            currentIdx++;
        }

        function showImage(url) {
            if (!url) return;
            noImageTxt.style.display = 'none';
            
            // สร้าง Effect เฟดภาพนุ่มนวลเวลาเปลี่ยนรูป
            mainDisplayImage.style.opacity = 0;
            setTimeout(() => {
                mainDisplayImage.src = url;
                mainDisplayImage.style.opacity = 1;
            }, 300);
        }

        // --- 4. ดึงข้อมูลและการตั้งค่าจากแอดมินแบบ Real-time ---
        onSnapshot(doc(db, "display", "settings"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                
                // อัปเดตข้อความข้างๆ QR Code
                if(data.titleText) {
                    document.getElementById('eventTitle').innerText = data.titleText;
                }

                // ตรวจสอบโหมดหน้าจอ (เปิด/ปิดจอฉุกเฉิน)
                currentMode = data.mode || 'all';
                if (currentMode === 'blackout') {
                    blackoutOverlay.classList.remove('hidden');
                    if (slideInterval) {
                        clearInterval(slideInterval);
                        slideInterval = null;
                    }
                } else {
                    blackoutOverlay.classList.add('hidden');
                    updatePhotoListener();
                }
            } else {
                updatePhotoListener();
            }
        });

        // --- 5. ตัวฟังสตรีมข้อมูลรูปภาพในคอลเลกชัน ---
        let photoUnsubscribe = null;
        function updatePhotoListener() {
            if (photoUnsubscribe) photoUnsubscribe();
            
            const q = (currentMode === 'latest') 
                ? query(collection(db, "photos"), orderBy("timestamp", "desc"), limit(10))
                : query(collection(db, "photos"), orderBy("timestamp", "desc"), limit(100));

            photoUnsubscribe = onSnapshot(q, (snapshot) => {
                currentPhotos = snapshot.docs.map(d => d.data());
                if (currentPhotos.length > 0 && !slideInterval && currentMode !== 'blackout') {
                    startSlideshow();
                }
            });
        }

        // --- 6. ระบบดักฟังคำสั่งบังคับส่งภาพขึ้นทันที (Manual Override 5 วินาที) ---
        onSnapshot(doc(db, "display", "main"), (docSnap) => {
            if (docSnap.exists() && currentMode !== 'blackout') {
                const data = docSnap.data();
                const now = Date.now();
                
                // หากคำสั่งเพิ่งส่งมาไม่เกิน 5 วินาที ให้ตัดหน้าจอแสดงทันที
                if (now - data.time < 5000) {
                    manualOverride = true;
                    showImage(data.currentImageUrl);
                    
                    clearTimeout(window.manualTimer);
                    window.manualTimer = setTimeout(() => {
                        manualOverride = false;
                        // เมื่อครบ 5 วินาที ให้กลับไปเล่นสไลด์โชว์ตามลำดับเดิม
                        playNextSlide(); 
                    }, 5000); 
                }
            }
        });

    </script>
</body>
</html>
