<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Screen - Live Event</title>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* Animation พื้นหลังไล่สีแบบเคลื่อนไหว */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body { 
            background: linear-gradient(-45deg, #0a0a0a, #1a1a2e, #16213e, #0f3460);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden; 
            margin: 0; 
            font-family: 'Itim', cursive;
        }
    </style>
</head>
<body class="w-screen h-screen flex text-white select-none">

    <div class="flex-1 h-full flex items-center justify-center p-6 relative">
        <img id="mainDisplayImage" class="w-full h-full object-contain drop-shadow-[0_10px_20px_rgba(0,0,0,0.7)] transition-all duration-700 ease-in-out opacity-0" src="" alt="Event Broadcast">
        
        <div id="noImageTxt" class="absolute text-3xl font-bold text-gray-400 animate-pulse text-center">
            🚀 กำลังรอรูปภาพจากผู้ร่วมสนุก...
        </div>
    </div>

    <div class="w-[480px] shrink-0 h-full bg-black/60 backdrop-blur-xl border-l border-white/10 shadow-2xl flex flex-col items-center py-10 px-8 relative z-10">
        
        <img id="sidebarLogo" class="max-h-32 mb-8 hidden object-contain drop-shadow-xl" alt="Shop Logo">
        
        <div id="clockTime" class="text-6xl font-bold text-yellow-400 tracking-wider mb-6 drop-shadow-md">00:00:00</div>
        
        <div id="eventTitle" class="text-3xl text-white font-bold text-center mb-10 drop-shadow-md">สแกนเพื่อส่งรูปขึ้นจอ</div>
        
        <div class="bg-white p-5 rounded-3xl shadow-[0_0_30px_rgba(255,255,255,0.2)] mb-auto">
            <div id="qrcode"></div>
        </div>

        <div class="mt-12 text-center bg-white/10 p-6 rounded-3xl w-full border border-white/20 shadow-inner">
            <div class="text-gray-300 text-xl mb-2 font-medium">⏳ ภาพถัดไปใน</div>
            <div id="countdownTxt" class="text-6xl font-bold text-blue-400 drop-shadow-lg transition-all">5s</div>
        </div>

    </div>

    <div id="blackoutOverlay" class="fixed inset-0 bg-black z-50 flex items-center justify-center hidden">
        <h1 class="text-5xl font-bold text-gray-600 animate-pulse">พักหน้าจอระบบสักครู่...</h1>
    </div>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { collection, query, orderBy, onSnapshot, limit, doc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const mainDisplayImage = document.getElementById('mainDisplayImage');
        const noImageTxt = document.getElementById('noImageTxt');
        const blackoutOverlay = document.getElementById('blackoutOverlay');

        let currentPhotos = [];
        let currentMode = 'all'; // 'all', 'latest', 'blackout'
        let currentIdx = 0;
        
        // ตัวแปรรองรับระบบจับเวลา
        let slideTimeLeft = 5;
        let mainLoop = null;

        // --- 1. ระบบนาฬิกาหน้างาน ---
        function updateClock() {
            const now = new Date();
            document.getElementById('clockTime').innerText = now.toLocaleTimeString('th-TH', { hour12: false });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 2. ระบบ QR Code สแกนร่วมสนุก ---
        new QRCode(document.getElementById("qrcode"), {
            text: "https://suchartstudio.github.io/photolive/", 
            width: 250, // ปรับให้ใหญ่ขึ้น พอดีกับความกว้าง 480px
            height: 250,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.M
        });

        // --- 3. ฟังก์ชันควบคุมการเล่นสไลด์โชว์แบบใหม่ (ผูกกับตัวเลข UI) ---
        function startSlideshow() {
            if (mainLoop) clearInterval(mainLoop);
            
            // แสดงรูปแรกทันที
            playNextSlide(); 
            
            // ลูปหลักทำงานทุกๆ 1 วินาที
            mainLoop = setInterval(() => {
                slideTimeLeft--;
                
                if (slideTimeLeft <= 0) {
                    playNextSlide();
                } else {
                    document.getElementById('countdownTxt').innerText = slideTimeLeft + 's';
                }
            }, 1000);
        }

        function playNextSlide() {
            // รีเซ็ตเวลากลับเป็น 5 วินาที
            slideTimeLeft = 5; 
            document.getElementById('countdownTxt').innerText = slideTimeLeft + 's';
            
            if (currentPhotos.length === 0) return;
            if (currentIdx >= currentPhotos.length) currentIdx = 0;
            
            showImage(currentPhotos[currentIdx].url);
            currentIdx++;
        }

        function showImage(url) {
            if (!url) return;
            noImageTxt.style.display = 'none';
            
            // Effect เฟดภาพ
            mainDisplayImage.style.opacity = 0;
            setTimeout(() => {
                mainDisplayImage.src = url;
                mainDisplayImage.style.opacity = 1;
            }, 300);
        }

        // --- 4. ดึงข้อมูลและการตั้งค่าจากแอดมินแบบ Real-time ---
        onSnapshot(doc(db, "display", "settings"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                
                // อัปเดตข้อความ
                if(data.titleText) document.getElementById('eventTitle').innerText = data.titleText;
                
                // อัปเดตโลโก้ร้าน
                if(data.logoUrl) {
                    const sidebarLogo = document.getElementById('sidebarLogo');
                    sidebarLogo.src = data.logoUrl;
                    sidebarLogo.classList.remove('hidden');
                }

                // โหมดพักจอฉุกเฉิน
                currentMode = data.mode || 'all';
                if (currentMode === 'blackout') {
                    blackoutOverlay.classList.remove('hidden');
                    if (mainLoop) {
                        clearInterval(mainLoop);
                        mainLoop = null;
                    }
                } else {
                    blackoutOverlay.classList.add('hidden');
                    updatePhotoListener();
                }
            } else {
                updatePhotoListener();
            }
        });

        // --- 5. ตัวฟังสตรีมข้อมูลรูปภาพในคอลเลกชัน ---
        let photoUnsubscribe = null;
        function updatePhotoListener() {
            if (photoUnsubscribe) photoUnsubscribe();
            
            const q = (currentMode === 'latest') 
                ? query(collection(db, "photos"), orderBy("timestamp", "desc"), limit(10))
                : query(collection(db, "photos"), orderBy("timestamp", "desc"), limit(100));

            photoUnsubscribe = onSnapshot(q, (snapshot) => {
                currentPhotos = snapshot.docs.map(d => d.data());
                // เริ่มวงจรเมื่อมีรูปและยังไม่ได้เปิด Loop
                if (currentPhotos.length > 0 && !mainLoop && currentMode !== 'blackout') {
                    startSlideshow();
                }
            });
        }

        // --- 6. ระบบคำสั่งบังคับแทรกรูป (Override) ทันทีจาก Admin ---
        onSnapshot(doc(db, "display", "main"), (docSnap) => {
            if (docSnap.exists() && currentMode !== 'blackout') {
                const data = docSnap.data();
                const now = Date.now();
                
                // หากถูกสั่งให้ขึ้นจอ (ระยะเวลาไม่เกิน 5 วินาทีที่ผ่านมา)
                if (now - data.time < 5000) {
                    // รีเซ็ตการนับถอยหลังใหม่เป็น 5 และโชว์รูปที่แทรกทันที
                    slideTimeLeft = 5; 
                    document.getElementById('countdownTxt').innerText = slideTimeLeft + 's';
                    showImage(data.currentImageUrl);
                }
            }
        });

    </script>
</body>
</html>
